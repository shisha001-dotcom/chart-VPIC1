<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DataViz Studio Pro</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- html2canvas for export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/charts.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">📊</span>
      <span class="logo-text">DataViz Pro</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn active" data-view="dashboard">
        <span class="nav-icon">📈</span> Dashboard
      </button>
      <button class="nav-btn" data-view="charts">
        <span class="nav-icon">🎨</span> Chart Builder
      </button>
      <button class="nav-btn" data-view="table">
        <span class="nav-icon">📋</span> Data Table
      </button>
    </nav>

    <div class="sidebar-file">
      <label class="upload-btn" for="excelFile">
        <span class="upload-icon">⬆</span>
        <span>Load Excel</span>
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" hidden>
      </label>
      <div class="file-info" id="fileInfo">No file loaded</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="main">

    <!-- Topbar -->
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard Overview</div>
      <div class="topbar-actions">
        <button class="btn-export" id="exportDashboardBtn" title="Export dashboard as image" disabled>
          ⬇ Export PNG
        </button>
      </div>
    </header>

    <!-- Views Container -->
    <div class="view-container">

      <!-- DASHBOARD VIEW -->
      <section class="view active" id="view-dashboard">
        <div class="dashboard-header">
          <h2>Data Insights</h2>
          <button class="btn-refresh" id="refreshBtn" title="Refresh charts">🔄 Refresh</button>
        </div>

        <div class="kpi-grid" id="kpiGrid">
          <div class="kpi-empty">
            <div class="empty-icon">📊</div>
            <p>Upload an Excel file to start analyzing</p>
          </div>
        </div>

        <div class="charts-grid" id="dashboardChartsGrid">
          <!-- Auto-generated charts injected here -->
        </div>
      </section>

      <!-- CHARTS BUILDER VIEW -->
      <section class="view" id="view-charts">
        <div class="chart-builder">
          <div class="builder-panel">
            <h2 class="panel-title">Create Custom Chart</h2>

            <div class="field-group">
              <label>Chart Type</label>
              <div class="chart-type-grid" id="chartTypeGrid">
                <!-- Auto-populated -->
              </div>
            </div>

            <div class="field-group">
              <label>X Axis / Category</label>
              <select id="xAxisSelect" class="field-select">
                <option value="">— Select column —</option>
              </select>
            </div>

            <div class="field-group">
              <label>Y Axis / Value</label>
              <select id="yAxisSelect" class="field-select">
                <option value="">— Select column —</option>
              </select>
            </div>

            <div class="field-group">
              <label>Group By (optional)</label>
              <select id="groupSelect" class="field-select">
                <option value="">— None —</option>
              </select>
            </div>

            <div class="field-group">
              <label>Aggregation</label>
              <select id="aggSelect" class="field-select">
                <option value="sum">Sum</option>
                <option value="count">Count</option>
                <option value="avg">Average</option>
                <option value="max">Max</option>
                <option value="min">Min</option>
              </select>
            </div>

            <div class="field-group">
              <label>Color Palette</label>
              <div class="palette-grid" id="paletteGrid">
                <!-- Auto-populated -->
              </div>
            </div>

            <button class="btn-primary" id="buildChartBtn">
              🎨 Build Chart
            </button>
          </div>

          <div class="chart-preview" id="chartPreview">
            <div class="preview-empty" id="previewEmpty">
              <div class="empty-icon">🎨</div>
              <p>Configure and build your chart</p>
            </div>
            <div id="customChartContainer"></div>
            <div class="chart-actions" id="chartActions" style="display:none">
              <button class="btn-secondary" id="addToDashboardBtn">➕ Add to Dashboard</button>
              <button class="btn-secondary" id="downloadChartBtn">⬇ Download PNG</button>
            </div>
          </div>
        </div>
      </section>

      <!-- DATA TABLE VIEW -->
      <section class="view" id="view-table">
        <div class="table-wrapper">
          <div class="table-toolbar">
            <input type="text" id="tableSearch" class="table-search" placeholder="Search data...">
            <span class="table-count" id="tableCount"></span>
          </div>
          <div class="table-scroll">
            <table id="dataTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Loading Spinner -->
  <div class="spinner" id="spinner"></div>

  <!-- JavaScript Modules -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
